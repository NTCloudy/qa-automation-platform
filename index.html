<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA 自動化測試平台</title>
  <style>
    :root {
      --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085;
      --primary:#635bff; --border:#e5e7eb; --success:#16a34a;
      --danger:#dc2626; --warning:#d97706;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      background:var(--bg); color:var(--text); }
    header { background:#111827; color:white; padding:18px 28px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    header h1 { margin:0; font-size:20px; } header span { color:#aeb7c7; font-size:13px; }
    .wrap { max-width:1250px; margin:24px auto; padding:0 18px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
    .stat,.card { background:var(--card); border:1px solid var(--border); border-radius:14px; }
    .stat { padding:18px; } .stat .label { color:var(--muted); font-size:13px; }
    .stat .num { font-size:28px; font-weight:700; margin-top:5px; }
    .grid { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; }
    .card { padding:18px; margin-bottom:18px; }
    .card h2 { font-size:16px; margin:0 0 14px; }
    .toolbar { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
    button { border:0; border-radius:9px; padding:9px 13px; cursor:pointer; font-weight:600; }
    .primary { background:var(--primary); color:white; } .secondary { background:#eef0f5; color:#344054; }
    .danger { background:#fee2e2; color:#991b1b; } .success { background:#dcfce7; color:#166534; }
    input,select,textarea { width:100%; border:1px solid #d7dce5; border-radius:9px; padding:10px; font:inherit; }
    textarea { min-height:100px; resize:vertical; }
    .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .full { grid-column:1/-1; } label { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
    table { width:100%; border-collapse:collapse; } th,td { padding:11px 8px; border-bottom:1px solid #edf0f4; text-align:left; font-size:13px; }
    th { color:var(--muted); font-weight:600; } .badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; }
    .pass { background:#dcfce7; color:#166534; } .fail { background:#fee2e2; color:#991b1b; } .idle { background:#eef2f7; color:#475467; }
    .log { background:#0b1220; color:#d1d5db; border-radius:10px; padding:12px; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; min-height:150px; white-space:pre-wrap; }
    .empty { text-align:center; color:var(--muted); padding:28px; }
    .small { font-size:12px; color:var(--muted); }
    .row-actions { display:flex; gap:5px; }
    @media(max-width:850px){ .grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto} }
  </style>
</head>
<body>
<header>
  <div><h1>🧪 QA 自動化測試平台</h1><span>Prototype · Mock Test Runner · Browser localStorage</span></div>
  <button class="secondary" onclick="clearAll()">清除所有資料</button>
</header>

<div class="wrap">
  <section class="stats">
    <div class="stat"><div class="label">測試案例</div><div class="num" id="total">0</div></div>
    <div class="stat"><div class="label">Pass</div><div class="num" id="passed">0</div></div>
    <div class="stat"><div class="label">Fail</div><div class="num" id="failed">0</div></div>
    <div class="stat"><div class="label">Pass Rate</div><div class="num" id="rate">0%</div></div>
  </section>

  <div class="grid">
    <main>
      <section class="card">
        <h2>測試案例</h2>
        <div class="toolbar">
          <button class="primary" onclick="runAll()">▶ 執行全部</button>
          <button class="secondary" onclick="seedDemo()">載入 Demo Cases</button>
          <button class="secondary" onclick="exportData()">匯出 JSON</button>
          <label style="width:auto;display:flex;align-items:center;gap:6px">
            <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none">
            <button class="secondary" onclick="document.getElementById('importFile').click()">匯入 JSON</button>
          </label>
        </div>
        <div id="caseTable"></div>
      </section>

      <section class="card">
        <h2>執行紀錄</h2>
        <div id="history"></div>
      </section>
    </main>

    <aside>
      <section class="card">
        <h2>新增測試案例</h2>
        <div class="formgrid">
          <div class="full"><label>測試名稱</label><input id="name" placeholder="例如：登入功能 - 正確帳密"></div>
          <div><label>模組</label><input id="module" placeholder="Login"></div>
          <div><label>預期結果</label><select id="expected"><option>PASS</option><option>FAIL</option></select></div>
          <div class="full"><label>測試步驟</label><textarea id="steps" placeholder="1. 開啟登入頁&#10;2. 輸入帳號密碼&#10;3. 點擊 Login"></textarea></div>
        </div>
        <button class="primary" style="margin-top:12px;width:100%" onclick="addCase()">＋ 新增案例</button>
      </section>

      <section class="card">
        <h2>Test Runner</h2>
        <div class="small" id="runnerStatus">尚未執行測試</div>
        <div class="log" id="log">等待測試執行...</div>
      </section>
    </aside>
  </div>
</div>

<script>
const KEY='qa-automation-platform-v1';
const HISTORY='qa-automation-history-v1';
let cases=JSON.parse(localStorage.getItem(KEY)||'[]');
let history=JSON.parse(localStorage.getItem(HISTORY)||'[]');

function save(){localStorage.setItem(KEY,JSON.stringify(cases));localStorage.setItem(HISTORY,JSON.stringify(history));render();}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function badge(v){return `<span class="badge ${v==='PASS'?'pass':v==='FAIL'?'fail':'idle'}">${v||'Not Run'}</span>`}

function render(){
 document.getElementById('total').textContent=cases.length;
 const p=cases.filter(x=>x.status==='PASS').length, f=cases.filter(x=>x.status==='FAIL').length;
 document.getElementById('passed').textContent=p; document.getElementById('failed').textContent=f;
 document.getElementById('rate').textContent=(p+f?Math.round(p/(p+f)*100):0)+'%';
 document.getElementById('caseTable').innerHTML=cases.length?`<table><thead><tr><th>名稱</th><th>模組</th><th>結果</th><th>操作</th></tr></thead><tbody>${
 cases.map((c,i)=>`<tr><td><b>${esc(c.name)}</b><div class="small">${esc(c.steps).slice(0,70)}</div></td><td>${esc(c.module)}</td><td>${badge(c.status)}</td><td><div class="row-actions"><button class="success" onclick="runOne(${i})">Run</button><button class="danger" onclick="removeCase(${i})">刪除</button></div></td></tr>`).join('')
 }</tbody></table>`:'<div class="empty">還沒有測試案例，先按「載入 Demo Cases」吧。</div>';
 document.getElementById('history').innerHTML=history.length?`<table><thead><tr><th>時間</th><th>案例</th><th>結果</th><th>耗時</th></tr></thead><tbody>${
 history.slice(0,30).map(h=>`<tr><td>${esc(h.time)}</td><td>${esc(h.name)}</td><td>${badge(h.result)}</td><td>${h.ms} ms</td></tr>`).join('')
 }</tbody></table>`:'<div class="empty">尚無執行紀錄</div>';
}
function addCase(){
 const name=document.getElementById('name').value.trim(); if(!name){alert('請輸入測試名稱');return;}
 cases.push({id:Date.now(),name,module:document.getElementById('module').value.trim()||'General',
 steps:document.getElementById('steps').value.trim(), expected:document.getElementById('expected').value,status:'Not Run'});
 ['name','module','steps'].forEach(id=>document.getElementById(id).value=''); save();
}
function removeCase(i){cases.splice(i,1);save();}
async function runOne(i){
 const c=cases[i]; document.getElementById('runnerStatus').textContent='正在執行：'+c.name;
 document.getElementById('log').textContent=`[START] ${c.name}\n[STEP] ${c.steps||'Mock execution'}\n[WAIT] Running...`;
 await new Promise(r=>setTimeout(r,500+Math.random()*900));
 const result=Math.random()<0.82?'PASS':'FAIL';
 c.status=result;
 const ms=Math.floor(500+Math.random()*1300);
 history.unshift({time:new Date().toLocaleString('zh-TW'),name:c.name,result,ms});
 document.getElementById('log').textContent=`[START] ${c.name}\n[STEP] Execute mock test\n[ASSERT] Expected: ${c.expected}\n[RESULT] ${result}\n[DONE] ${ms} ms`;
 document.getElementById('runnerStatus').textContent=`完成：${result}`;
 save();
}
async function runAll(){for(let i=0;i<cases.length;i++)await runOne(i);}
function seedDemo(){
 cases=[
 {id:1,name:'登入功能 - 正確帳密',module:'Login',steps:'開啟登入頁\\n輸入正確帳號密碼\\n點擊 Login',expected:'PASS',status:'Not Run'},
 {id:2,name:'登入功能 - 錯誤密碼',module:'Login',steps:'輸入錯誤密碼\\n確認錯誤訊息',expected:'PASS',status:'Not Run'},
 {id:3,name:'購物車 - 新增商品',module:'Cart',steps:'搜尋商品\\n加入購物車\\n確認數量',expected:'PASS',status:'Not Run'},
 {id:4,name:'結帳 - 無效付款資料',module:'Checkout',steps:'輸入無效卡號\\n確認驗證訊息',expected:'FAIL',status:'Not Run'}
 ]; save();
}
function exportData(){
 const blob=new Blob([JSON.stringify({cases,history},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qa-test-data.json';a.click();
}
function importData(e){
 const file=e.target.files[0];if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);cases=d.cases||[];history=d.history||[];save();}catch{alert('JSON 格式錯誤');}};r.readAsText(file);
}
function clearAll(){if(confirm('確定清除所有測試案例與紀錄？')){cases=[];history=[];save();}}
render();
</script>
</body>
</html>
